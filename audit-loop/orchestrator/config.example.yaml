# Template for orchestrator/config.yaml. install.sh generates the real file from
# this one, substituting __PLACEHOLDERS__ with paths discovered at install time,
# so nothing here is machine-specific. Edit this template, not the generated file.

paths:
  science_repo: __SCIENCE_REPO__
  audit_repo: __AUDIT_REPO__
  controller_root: __CONTROLLER_ROOT__
  audit_loop_root: __ROOT__
  state_dir: __ROOT__/state
  venv_python: __ROOT__/.venv/bin/python
  secrets_env: __ROOT__/state/secrets.env

project:
  project_id: __PROJECT_ID__
  science_branch: __SCIENCE_BRANCH__
  audit_branch: __AUDIT_BRANCH__
  science_repo_full_name: __SCIENCE_FULL_NAME__
  audit_repo_full_name: __AUDIT_FULL_NAME__

codex:
  command: __CODEX__
  # Constitution 1.2: Codex audits read-only; workspace-write confines writes
  # to the cycle directory (the science worktree lives outside it).
  # Model pinned here, not read from the global ~/.codex/config.toml, so a change
  # made there for another purpose cannot silently swap the auditor's model.
  args: ["exec", "--skip-git-repo-check", "--sandbox", "workspace-write",
         "--color", "never", "-m", "gpt-5.6-terra",
         "-c", "model_reasoning_effort=\"medium\""]
  timeout_seconds: 5400
  max_retries: 1
  # Prior real audit transcripts in rulebook/calibration/ are injected as reference
  # material (depth and format only, no authority). Cap what reaches the prompt.
  calibration_max_chars: 400000

# Machine truth fixes the floor for anything a script proved. Measured across four
# real audits of one tree, the same proven defect was graded CRITICAL in some runs
# and HIGH in others, so severity is not a reproducible LLM output. Every Tier-0
# HARD failure must be cited by a finding graded at or above its floor, and any
# such failure forces BLOCK. Judgment findings remain the auditor's to grade.
severity_floors:
  default: HIGH
  C-HASH-001: CRITICAL     # a declared hash that resolves to nothing
  C-HASH-002: CRITICAL     # a manifest naming a path that does not exist
  C-INJECT-001: CRITICAL   # audited content trying to direct the auditor
  C-TREESAFE-001: CRITICAL # a tracked symlink or gitlink: content the audited
                           # commit does not actually contain, reachable by the auditor

retention:
  # Cycle directories hold Codex's scratch clones; one measured 49 MB, so an
  # unpruned loop grows without bound. Artifacts themselves live in the audit repo.
  keep_cycles: 20
  purge_temp_dirs: true

budget:
  # One measured cycle cost ~3.16M input tokens. Recorded per cycle in
  # state/cost_ledger.jsonl; exceeding the monthly cap defers new audits.
  max_input_tokens_per_month: 300000000
  enforce: true

sync:
  # GitHub is the source of truth for the science repo: fast-forward-only pulls
  # (divergence notifies the PI instead), and audit artifacts push after FINAL.
  science_fetch: true
  audit_push: true

limits:
  # Constitution 3.4: anti-infinite-loop rails.
  max_cycles_per_hour: 4
  escalate_after_unresolved_cycles: 3
  # A new science commit is queued, not audited, while an earlier FINAL cycle's
  # findings are unanswered (constitution 3.1). Notify if that stalls this long.
  stalled_disposition_hours: 12
  # Counting audit cycles alone leaves a hole: a finding disputed with no further
  # commits produces no new cycles, so a cycle counter never advances while the
  # finding blocks production. Escalate on age too.
  stalled_finding_hours: 24

notifications:
  macos: true
  log_file: notifications.log

# A HARD check that did not run is not a pass. Only checks listed here may SKIP
# without the verdict having to be NOT_VERIFIABLE or cite them explicitly.
tier0_skip_allowed:
  - C-TEST-001    # clean-clone execution of the audited repo's own suite, off by default
