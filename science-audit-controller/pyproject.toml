[project]
name = "science-audit-controller"
version = "1.0.0"
description = "Automation controller for scientific audit cycles."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "httpx>=0.27,<1",
  "jsonschema[format-nongpl]>=4.22",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
test = [
  "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
